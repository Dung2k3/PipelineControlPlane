apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamflow-activation-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: streamflow-activation-api-deployment-manager
rules:
  - apiGroups: [ "apps" ]
    resources: [ "deployments" ]
    verbs: [ "get", "list", "patch", "update", "create", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: streamflow-activation-api-deployment-manager
subjects:
  - kind: ServiceAccount
    name: streamflow-activation-api
roleRef:
  kind: Role
  name: streamflow-activation-api-deployment-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamflow-activation-api
  labels:
    app: streamflow-activation-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamflow-activation-api
  template:
    metadata:
      labels:
        app: streamflow-activation-api
    spec:
      serviceAccountName: streamflow-activation-api
      containers:
        - name: activation-api
          image: streamflow/activation-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7100
          env:
            - name: API_PORT
              value: "7100"
            - name: COUCHBASE_CONNECTION_STRING
              value: "couchbase://couchbase"
            - name: COUCHBASE_USERNAME
              value: "Administrator"
            - name: COUCHBASE_PASSWORD
              value: "password"
            - name: COUCHBASE_BUCKET
              value: "streamflow"
            - name: PIPELINE_COUCHBASE_CONNECTION_STRING
              value: "couchbase://couchbase"
            - name: PIPELINE_IMAGE
              value: "streamflow/pipeline-control-plane:1.0"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: streamflow-activation-api
spec:
  selector:
    app: streamflow-activation-api
  ports:
    - port: 80
      targetPort: 7100
